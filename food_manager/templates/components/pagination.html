<div class="join">

    {% if recipes.has_previous %}
        <a href="?page=1" class="join-item btn">First</a>
        <a href="?page={{ recipes.previous_page_number }}" class="join-item btn">«</a>
    {% else %}
        <button class="join-item btn" disabled="disabled">First</button>
        <button class="join-item btn" disabled="disabled">«</button>
    {% endif %}
    <button class="join-item btn">Page {{ recipes.number }} of {{ recipes.paginator.num_pages }}</button>
    {% if recipes.has_next %}
        <a href="?page={{ recipes.next_page_number }}" class="join-item btn">»</a>
        <a href="?page={{ recipes.paginator.num_pages }}" class="join-item btn">Last</a>
    {% else %}
        <button class="join-item btn" disabled="disabled">»</button>
        <button class="join-item btn" disabled="disabled">Last</button>
    {% endif %}

</div>
